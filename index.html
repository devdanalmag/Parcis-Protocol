<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcis - The Identity Protocol for Arc Commerce</title>
  <meta name="description"
    content="Build your on-chain reputation. Accept USDC payment and trustless escrow. Every deal builds your verifiable Parcis Trust Score.">

  <!-- Open Graph / Discord / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://parcis.app/">
  <meta property="og:title" content="Parcis - The Identity Protocol for Arc Commerce">
  <meta property="og:description"
    content="Build your on-chain reputation. Accept USDC via payment links and trustless escrow. Every deal builds your verifiable Parcis Trust Score.">
  <meta property="og:image" content="https://parcis.app/logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://parcis.app/">
  <meta property="twitter:title" content="Parcis - The Identity Protocol for Arc Commerce">
  <meta property="twitter:description"
    content="Build your on-chain reputation. Accept USDC via payment links and trustless escrow. Every deal builds your verifiable Parcis Trust Score.">
  <meta property="twitter:image" content="https://parcis.app/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <nav id="main-nav">
    <div class="nav-inner">
      <a href="#/" class="nav-logo" id="logo-link">
        <img src="/logo.png" alt="Parcis" style="width:28px;height:28px;border-radius:7px;object-fit:cover;">
        <span>Parcis</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="#/" class="nav-link" data-page="home" id="nav-home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          Home
        </a>
        <a href="#/send" class="nav-link" data-page="send" id="nav-send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Create Link
        </a>
        <a href="#/safe" class="nav-link safe-link" data-page="safe" id="nav-safe">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          Safe
        </a>
        <a href="#/dashboard" class="nav-link" data-page="dashboard" id="nav-dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Dashboard
        </a>
        <div class="nav-dropdown" id="nav-dev-dropdown">
          <button class="nav-link nav-dropdown-trigger" data-page="developers" id="nav-developers">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="16.5" y1="9.4" x2="7.5" y2="4.21" />
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
              <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
              <line x1="12" y1="22.08" x2="12" y2="12" />
            </svg>
            Developers
            <svg class="dropdown-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="nav-dropdown-menu" id="dev-dropdown-menu">
            <a href="#/developers" class="nav-dropdown-item" data-page="developers">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              SDK Docs
            </a>
            <a href="#/docs" class="nav-dropdown-item" data-page="docs" id="nav-docs">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              API Docs
            </a>
            <a href="#/console" class="nav-dropdown-item console-link" data-page="console" id="nav-console">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
              Console
            </a>
          </div>
        </div>
        <a href="javascript:void(0)" class="nav-link" data-page="" id="nav-admin" style="display: none !important;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Admin
        </a>
        <a href="javascript:void(0)" class="nav-link" id="nav-feedback" onclick="window.openFeedbackModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Feedback
        </a>
      </div>
      <div class="nav-actions" style="position:relative; display:flex; align-items:center; gap:8px;">
        <div class="network-badge" id="network-badge">
          <span class="network-dot"></span>
          Arc Testnet
        </div>
        <div class="wallet-button-container" id="wallet-button-container" data-status="loading">
          <button class="wallet-loading-btn" id="wallet-loading-btn" type="button" aria-label="Loading wallet connection" title="Checking wallet kit availability...">
            <span class="wallet-loading-spinner" aria-hidden="true"></span>
            <span class="wallet-loading-text">Loading...</span>
          </button>
          <appkit-button id="reown-appkit-btn" balance="hide" size="md"></appkit-button>
        </div>
      </div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>
  </nav>

  <main id="app"></main>
  <div id="toast-container"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Floating Feedback FAB -->
  <button class="feedback-fab" onclick="window.openFeedbackModal()" aria-label="Feedback">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
